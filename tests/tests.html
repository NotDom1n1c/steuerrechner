<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Steuerrechner Tests</title>
  <style>
    body {
      font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      max-width: 900px;
      margin: 1rem auto;
      padding: 1rem;
      background: #f4f6f8;
      color: #1a1a1a;
    }
    h1 { margin-top: 0; }
    #summary {
      padding: 0.6rem 0.8rem;
      border-radius: 6px;
      margin: 0.5rem 0;
      font-weight: 700;
    }
    #summary.all-pass { background: #d6f3dc; color: #1d6b30; }
    #summary.has-fail { background: #fde7e7; color: #b32020; }
    ul { list-style: none; padding: 0; }
    li {
      padding: 0.4rem 0.6rem;
      margin-bottom: 0.25rem;
      border-radius: 4px;
      border-left: 4px solid #ccc;
      background: #fff;
    }
    li.pass { border-left-color: #1d6b30; }
    li.fail { border-left-color: #b32020; background: #fde7e7; }
    button {
      padding: 0.5rem 1rem;
      border: 1px solid #1f4e7a;
      background: #1f4e7a;
      color: white;
      border-radius: 6px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>Steuerrechner Tests</h1>
  <p>Hinweis: Tests ueber HTTP-Server oeffnen (z.B. <code>python -m http.server</code>),
     da <code>file://</code> in vielen Browsern <code>fetch()</code> blockiert.</p>
  <button id="btn-run" type="button">Tests erneut ausfuehren</button>
  <div id="summary">Initialisiere...</div>
  <ul id="results"></ul>

  <!-- Optional: embedded.js erlaubt das Ausfuehren der Tests ueber file:// -->
  <script src="../data/embedded.js?v=5"></script>

  <!-- Module unter test -->
  <script src="../src/js/validate.js?v=5"></script>
  <script src="../src/js/calc.js?v=5"></script>
  <script src="../src/js/storage.js?v=5"></script>

  <!-- Test-Cases -->
  <script src="testcases.js?v=5"></script>
</body>
</html>
