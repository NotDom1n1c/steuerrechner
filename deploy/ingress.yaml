apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: steuerrechner
spec:
  ingressClassName: traefik
  rules:
    - host: steuerrechner.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: steuerrechner
                port:
                  name: http
