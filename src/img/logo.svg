<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 124" role="img" aria-label="TC Tax Calculator Logo">
  <title>TC – Tax Calculator</title>
  <!-- Taschenrechner-Korpus -->
  <rect x="8" y="4" width="84" height="116" rx="14" fill="#ffffff" stroke="#b5985a" stroke-width="6"/>
  <!-- Display mit TC -->
  <rect x="20" y="14" width="60" height="22" rx="5" fill="#ffffff" stroke="#b5985a" stroke-width="3.5"/>
  <text x="73" y="31" text-anchor="end" font-family="'Courier New', monospace" font-weight="700" font-size="15" fill="#b5985a">TC</text>
  <!-- Grosses TC-Monogramm -->
  <text x="50" y="67" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="40" fill="#b5985a">TC</text>
  <!-- Tastenreihe 1: + - x -->
  <rect x="22" y="82" width="15" height="15" rx="3" fill="#b5985a"/>
  <rect x="43" y="82" width="15" height="15" rx="3" fill="#b5985a"/>
  <rect x="64" y="82" width="15" height="15" rx="3" fill="#b5985a"/>
  <text x="29.5" y="93.5" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700" font-size="12" fill="#ffffff">+</text>
  <text x="50.5" y="93.5" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700" font-size="12" fill="#ffffff">&#8722;</text>
  <text x="71.5" y="93.5" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700" font-size="12" fill="#ffffff">&#215;</text>
  <!-- Tastenreihe 2: div = % -->
  <rect x="22" y="101" width="15" height="15" rx="3" fill="#b5985a"/>
  <rect x="43" y="101" width="15" height="15" rx="3" fill="#b5985a"/>
  <rect x="64" y="101" width="15" height="15" rx="3" fill="#b5985a"/>
  <text x="29.5" y="112.5" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700" font-size="12" fill="#ffffff">&#247;</text>
  <text x="50.5" y="112.5" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700" font-size="12" fill="#ffffff">=</text>
  <text x="71.5" y="112.5" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700" font-size="11" fill="#ffffff">%</text>
</svg>
